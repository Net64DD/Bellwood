name: Bellwood

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 git cmake ninja-build lsb-release file \
            libsdl2-dev libpng-dev libzip-dev zipcmp zipmerge ziptool \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev libfmt-dev libboost-dev \
            libopengl-dev libgl1-mesa-dev zlib1g-dev libbz2-dev libmbedtls-dev \
            libvulkan-dev libshaderc-dev glslang-dev spirv-tools

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-ccache-${{ github.ref }}
          restore-keys: |
            linux-ccache-

      - name: Cache third-party source builds
        uses: actions/cache@v6
        with:
          key: linux-thirdparty-sdl2.30.3-tinyxml2.10.0.0-libzip1.10.1
          path: |
            SDL2-2.30.3
            tinyxml2-10.0.0
            libzip-1.10.1

      - name: Install latest SDL
        run: |
          if [ ! -d "SDL2-2.30.3" ]; then
            wget -q https://www.libsdl.org/release/SDL2-2.30.3.tar.gz
            tar -xzf SDL2-2.30.3.tar.gz
            (cd SDL2-2.30.3 && ./configure --enable-hidapi-libusb && make -j$(nproc))
          fi
          sudo make -C SDL2-2.30.3 install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Install latest tinyxml2
        run: |
          if [ ! -d "tinyxml2-10.0.0" ]; then
            wget -q -O tinyxml2-10.0.0.tar.gz https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
            tar -xzf tinyxml2-10.0.0.tar.gz
            cmake -S tinyxml2-10.0.0 -B tinyxml2-10.0.0/build
            cmake --build tinyxml2-10.0.0/build -j$(nproc)
          fi
          sudo cmake --install tinyxml2-10.0.0/build

      - name: Install libzip without crypto
        run: |
          if [ ! -d "libzip-1.10.1" ]; then
            wget -q https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
            tar -xzf libzip-1.10.1.tar.gz
            cmake -S libzip-1.10.1 -B libzip-1.10.1/build \
              -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
            cmake --build libzip-1.10.1/build -j$(nproc)
          fi
          sudo cmake --install libzip-1.10.1/build
          sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
          sudo ldconfig

      - uses: root-project/gcc-problem-matcher-improved@v0.0.1-alpha.1

      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target Bellwood --parallel $(nproc)

      - name: Create AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          cd build
          cpack -G External

      - name: Create package
        run: |
          mkdir Bellwood-linux
          mv build/*.appimage Bellwood-linux/Bellwood.AppImage
          cp README.md Bellwood-linux/readme.txt
          wget -q -O Bellwood-linux/gamecontrollerdb.txt https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Bellwood-linux
          path: Bellwood-linux

  build-windows:
    name: Windows
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          key: windows-vcpkg-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            windows-vcpkg-
          path: |
            ~/AppData/Local/vcpkg/archives

      - name: Cache Vulkan SDK
        uses: actions/cache@v6
        with:
          key: windows-vulkan-sdk-v1
          path: C:\VulkanSDK

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\VulkanSDK\Lib")) {
            $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
            $p = Start-Process -FilePath "$env:RUNNER_TEMP\vulkan_sdk.exe" `
              -ArgumentList "--root","C:\VulkanSDK","--accept-licenses","--default-answer","--confirm-command","install" `
              -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed with exit code $($p.ExitCode)" }
          }
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: |
          cmake -S . -B build/x64 -G "Visual Studio 17 2022" -T ClangCL -A x64
          cmake --build build/x64 --config Release --target Bellwood --parallel

      - name: Create package
        run: |
          mkdir Bellwood-windows
          mkdir Bellwood-windows/debug
          Move-Item build/x64/Release/Bellwood.exe Bellwood-windows/
          Copy-Item build/x64/Bellwood.o2r Bellwood-windows/
          Move-Item build/x64/Release/config.yml Bellwood-windows/
          Move-Item build/x64/Release/assets Bellwood-windows/
          Get-ChildItem build/x64/Release/*.pdb | Move-Item -Destination Bellwood-windows/debug/
          Get-ChildItem build/x64/Release/*.dll | Copy-Item -Destination Bellwood-windows/
          if (-not (Test-Path build/x64/Release/.tcc/lib/Bellwood.def)) { throw "TCC runtime was not staged; mods would not compile" }
          Copy-Item build/x64/Release/.tcc Bellwood-windows/.tcc -Recurse
          Copy-Item README.md Bellwood-windows/readme.txt
          if (-not (Test-Path Bellwood-windows/shaderc_shared.dll)) {
            $shaderc = Get-ChildItem "$env:VULKAN_SDK/Bin/shaderc_shared.dll" -ErrorAction SilentlyContinue
            if (-not $shaderc) { throw "shaderc_shared.dll not found in the Vulkan SDK; the Vulkan backend would not start" }
            Copy-Item $shaderc.FullName Bellwood-windows/
          }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt" -OutFile "Bellwood-windows/gamecontrollerdb.txt"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Bellwood-windows
          path: Bellwood-windows
          include-hidden-files: true

  defender-scan:
    name: Windows Defender scan
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Bellwood-windows
          path: Bellwood-windows

      - name: Update Defender definitions
        shell: pwsh
        run: |
          $mp = 'C:\Program Files\Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mp)) { throw "MpCmdRun.exe not found; the runner image changed" }
          $code = 1
          for ($i = 1; $i -le 6; $i++) {
            & $mp -SignatureUpdate
            $code = $LASTEXITCODE
            if ($code -eq 0) { break }
            Write-Host "signature update attempt $i returned $code, retrying in 30s"
            Start-Sleep -Seconds 30
          }
          if ($code -ne 0) { Write-Host "::warning::signature update returned $code, scanning with current definitions" }
          Get-MpComputerStatus | Select-Object AntivirusSignatureVersion,AMEngineVersion | Format-List
          exit 0

      - name: Scan every shipped binary
        shell: pwsh
        run: |
          $mp = 'C:\Program Files\Windows Defender\MpCmdRun.exe'
          $failed = @()
          $binaries = Get-ChildItem Bellwood-windows -File -Recurse -Include *.exe,*.dll
          if ($binaries.Count -eq 0) { throw "No binaries found in the Windows package" }
          $binaries | ForEach-Object {
            $out = & $mp -Scan -ScanType 3 -File $_.FullName 2>&1 | Out-String
            $code = $LASTEXITCODE
            if ($code -ne 0 -or $out -match 'Threat(s)? (found|detected)|found \d+ threat') {
              $failed += $_.Name
              Write-Host "::error file=$($_.Name)::Defender flagged $($_.Name) (exit $code)"
              Write-Host $out
            } else {
              Write-Host "ok: $($_.Name) (exit $code)"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::Defender flagged: $($failed -join ', ')"
            Write-Host "If this is a false positive, submit it at https://www.microsoft.com/wdsi/filesubmission"
            exit 1
          }
          Write-Host "All binaries clean."

      - name: Report recorded detections
        if: always()
        shell: pwsh
        run: |
          $d = Get-MpThreatDetection -ErrorAction SilentlyContinue
          if ($d) {
            Write-Host "::warning::Defender recorded threat detections on this runner:"
            $d | Select-Object -Last 10 | Format-List InitialDetectionTime,ThreatID,Resources
          } else {
            Write-Host "No threat detections recorded."
          }

  build-xbox:
    name: Xbox (Dev Mode)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          key: xbox-vcpkg-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            xbox-vcpkg-
          path: |
            ~/AppData/Local/vcpkg/archives

      - name: Set up the Universal Windows Platform workload
        shell: pwsh
        run: |
          # The app container CRT (lib/x64/store), the UWP build of
          # d3dcompiler_47.dll and the VCLibs framework package all come from this
          # workload. CMake fails with a specific error for each if it is absent,
          # so install it when the runner image does not already carry it.
          $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$root\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw "No Visual Studio installation found on the runner" }

          if (-not (Get-ChildItem "$vs\VC\Tools\MSVC\*\lib\x64\store" -ErrorAction SilentlyContinue)) {
            Write-Host "Installing the UWP workload into $vs"
            # Start-Process -Wait rather than the installer's own --wait: some
            # installer builds reject that flag outright with exit code 87.
            $p = Start-Process -FilePath "$root\vs_installer.exe" -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vs`"",
              '--add', 'Microsoft.VisualStudio.Workload.Universal',
              '--add', 'Microsoft.VisualStudio.ComponentGroup.UWP.VC',
              '--quiet', '--norestart', '--nocache')
            # 3010 is "installed, reboot pending", which does not affect this build.
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              throw "UWP workload install failed with exit code $($p.ExitCode)"
            }
          }

          if (-not (Get-ChildItem "$vs\VC\Tools\MSVC\*\lib\x64\store" -ErrorAction SilentlyContinue)) {
            throw "App container CRT (lib/x64/store) still missing after installing the UWP workload"
          }

          $vcvars = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VSPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Ninja
        shell: pwsh
        run: |
          # A step only inherits the environment the runner started with, so a
          # PATH entry written by choco is not visible to later steps. Resolve
          # ninja here and publish its directory through GITHUB_PATH.
          $ninja = (Get-Command ninja -ErrorAction SilentlyContinue).Source
          if (-not $ninja) {
            $bundled = "$env:VSPATH\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe"
            if (Test-Path $bundled) {
              $ninja = $bundled
            } else {
              choco install ninja -y --no-progress
              $ninja = "C:\ProgramData\chocolatey\bin\ninja.exe"
            }
            if (-not (Test-Path $ninja)) { throw "ninja not found after install" }
            Split-Path $ninja | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          Write-Host "ninja: $ninja"

      - name: Create a sideloading certificate
        shell: pwsh
        run: |
          # Self-signed and generated per run, so CI needs no signing secrets. A
          # Dev Mode console only requires that the certificate be trusted, which
          # the deploy script does from the .cer shipped in the artifact. The
          # subject must match the package publisher exactly or the console
          # rejects the package.
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Bellwood CI" `
            -KeyUsage DigitalSignature -FriendlyName "Bellwood CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -NotAfter (Get-Date).AddYears(3)
          Export-Certificate -Cert $cert -FilePath bellwood-ci.cer | Out-Null
          "UWP_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify the toolchain
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          where ninja || exit /b 1
          where clang-cl || exit /b 1
          where makeappx || exit /b 1
          where signtool || exit /b 1
          if not exist "%VCToolsInstallDir%lib\x64\store" exit /b 1
          echo VCToolsInstallDir=%VCToolsInstallDir%

      - name: Build
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          REM vcvars points VCPKG_ROOT at the vcpkg bundled with Visual Studio, which
          REM is not a git checkout, so automate-vcpkg fails trying to update it.
          REM Cleared (quoted, or the value keeps the space before the newline) so it
          REM falls back to cloning into the build directory.
          set "VCPKG_ROOT="
          cmake -S . -B build-uwp -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=cmake/uwp.bellwood.toolchain.cmake ^
            -DUWP_PACKAGE_PUBLISHER="CN=Bellwood CI" ^
            -DUWP_PACKAGE_CERT_THUMBPRINT=%UWP_CERT_THUMBPRINT% || exit /b 1
          cmake --build build-uwp --target bellwood_uwp_package || exit /b 1

      - name: Create package
        shell: pwsh
        run: |
          mkdir Bellwood-xbox
          Move-Item build-uwp/Bellwood.msix Bellwood-xbox/
          Copy-Item bellwood-ci.cer Bellwood-xbox/
          Copy-Item tools/deploy-xbox.ps1 Bellwood-xbox/
          Copy-Item README.md Bellwood-xbox/readme.txt

          # Without the VCLibs framework package on the console the app fails to
          # activate with 0x8027025B, and it is only needed once per console.
          $vclibs = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs\14.0\Appx\Retail\x64\Microsoft.VCLibs.x64.14.00.appx" -ErrorAction SilentlyContinue
          if (-not $vclibs) { throw "VCLibs framework package not found; the app would not activate on the console" }
          Copy-Item $vclibs.FullName Bellwood-xbox/

          # The game archive is generated on the console from the user's own disc,
          # so the package deliberately ships without one. Everything else it
          # needs at startup is inside the msix.
          if (-not (Test-Path Bellwood-xbox/Bellwood.msix)) { throw "Package was not produced" }

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Bellwood-xbox
          path: Bellwood-xbox

  build-macos:
    name: macOS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        uses: melusina-org/setup-macports@v1
        with:
          parameters: '.github/macports.yml'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos-ccache-${{ github.ref }}
          restore-keys: |
            macos-ccache-

      - name: Build
        run: |
          export VULKAN_SDK=/opt/local
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target Bellwood --parallel $(sysctl -n hw.logicalcpu)

      - name: Create package
        run: |
          (cd build && cpack)
          mkdir Bellwood-mac
          mv _packages/*.dmg Bellwood-mac/Bellwood.dmg
          cp README.md Bellwood-mac/readme.txt

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Bellwood-mac
          path: Bellwood-mac

  build-android:
    name: Android
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "cmake;3.30.3" "ndk;30.0.15729638" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Write release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore || { echo "::error::empty keystore"; exit 1; }

      - name: Build APK (release-signed)
        if: env.KEYSTORE_BASE64 != ''
        run: android/gradlew -p android assembleRelease
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK (debug-signed)
        if: env.KEYSTORE_BASE64 == ''
        run: android/gradlew -p android assembleRelease

      - name: Create package
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }
          for entry in assets/gamedata.zip assets/gamedata.version \
                       assets/gamecontrollerdb.txt assets/mods/place_mods_here.txt \
                       lib/arm64-v8a/libmain.so lib/arm64-v8a/libSDL2.so lib/arm64-v8a/libc++_shared.so; do
            unzip -Z1 "$APK" | grep -qx "$entry" || { echo "::error::$entry missing from the APK"; exit 1; }
          done
          unzip -p "$APK" assets/gamedata.zip > "$RUNNER_TEMP/gamedata.zip"
          for entry in Bellwood.o2r config.yml; do
            unzip -Z1 "$RUNNER_TEMP/gamedata.zip" | grep -qx "$entry" \
              || { echo "::error::$entry missing from gamedata.zip"; exit 1; }
          done
          unzip -Z1 "$RUNNER_TEMP/gamedata.zip" | grep -q '^assets/ymls/' \
            || { echo "::error::gamedata.zip has no assets/ymls/ entries"; exit 1; }
          unzip -p "$RUNNER_TEMP/gamedata.zip" Bellwood.o2r > "$RUNNER_TEMP/Bellwood.o2r"
          unzip -Z1 "$RUNNER_TEMP/Bellwood.o2r" | grep -q '^shaders/' \
            || { echo "::error::Bellwood.o2r has no shaders/ entries"; exit 1; }
          mkdir Bellwood-android
          cp "$APK" Bellwood-android/Bellwood.apk
          cp README.md Bellwood-android/readme.txt

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Bellwood-android
          path: Bellwood-android

  build-ios:
    name: iOS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache build folder
        uses: actions/cache@v6
        with:
          key: ios-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ios-build-${{ github.ref }}
            ios-build-
          path: build-ios

      - name: Build (unsigned, device arm64)
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.bellwood.toolchain.cmake \
            -DPLATFORM=OS64 -DCMAKE_BUILD_TYPE=Release -DIOS_SIGNING=OFF
          cmake --build build-ios --config Release --target Bellwood -- \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Create package
        run: |
          APP="build-ios/Release-iphoneos/Bellwood.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
          for f in Bellwood Bellwood.o2r config.yml assets/ymls Info.plist; do
            test -e "$APP/$f" || { echo "::error::$f missing from the app bundle"; exit 1; }
          done
          unzip -Z1 "$APP/Bellwood.o2r" | grep -q '^shaders/' \
            || { echo "::error::Bellwood.o2r has no shaders/ entries"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          mkdir Bellwood-ios
          zip -qry Bellwood-ios/Bellwood-unsigned.ipa Payload
          cp README.md Bellwood-ios/readme.txt
          cat > Bellwood-ios/SIDELOADING.txt <<'EOF'
          This IPA is UNSIGNED. Install it with a sideloading tool that re-signs
          with your own Apple ID, such as AltStore, SideStore or Sideloadly.

          Nothing from the game ships inside it. After installing, open the
          Files app and copy your own Animal Crossing disc image (.iso, .gcm,
          .ciso or .gcz), or an ac.o2r you generated earlier, into
          "On My iPhone > Bellwood". The app extracts the disc on first launch.
          EOF

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Bellwood-ios
          path: Bellwood-ios

  build-web:
    name: Web
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: web-ccache-${{ github.ref }}
          restore-keys: |
            web-ccache-

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.12
          actions-cache-folder: emsdk-cache

      - name: Build zlib port
        run: embuilder build zlib

      - name: Build
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-web --target Bellwood --parallel $(nproc)

      - name: Create package
        run: |
          BUILD=build-web
          mkdir Bellwood-web
          for f in bellwood.js bellwood.wasm bellwood.wasm.map bellwood.data coi-serviceworker.js favicon.png \
                   apple-touch-icon.png; do
            test -s "$BUILD/$f" || { echo "::error::$BUILD/$f missing or empty"; exit 1; }
            cp "$BUILD/$f" Bellwood-web/
          done
          cp "$BUILD/bellwood.html" Bellwood-web/bellwood.html
          cp "$BUILD/bellwood.html" Bellwood-web/index.html
          cp README.md Bellwood-web/readme.txt

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Bellwood-web
          path: Bellwood-web
